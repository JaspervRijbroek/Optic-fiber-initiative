; Supervisor configuration for the Symfony Messenger async consumer.
;
; Setup (run once on the server):
;   sudo ln -s /var/www/optic-fiber-initiative/current/.supervisor/messenger-consume.conf \
;              /etc/supervisor/conf.d/messenger-consume.conf
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Requires sudo access for supervisorctl without a password:
;   deploy ALL=(ALL) NOPASSWD: /usr/bin/supervisorctl

[program:messenger-consume]
command=/usr/bin/php /var/www/optic-fiber-initiative/current/bin/console messenger:consume async --time-limit=3600 --memory-limit=128M
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=0
startretries=3
process_name=%(program_name)s
stdout_logfile=/var/www/optic-fiber-initiative/shared/var/log/messenger-consume.log
stderr_logfile=/var/www/optic-fiber-initiative/shared/var/log/messenger-consume.error.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
