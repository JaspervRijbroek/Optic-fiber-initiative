# Cloudflare Pages + Workers configuration
# https://developers.cloudflare.com/pages/

name = "optic-fiber-initiative"
pages_build_output_dir = "."   # static files served from the repo root

# ── D1 database binding ────────────────────────────────────────────────────────
# After creating the database with:
#   wrangler d1 create fibra-optica-db
# replace <DATABASE_ID> with the ID printed by the command above.

[[d1_databases]]
binding  = "DB"
database_name = "fibra-optica-db"
database_id = "fb24b00e-1ffa-4792-9531-4d59e6147d9b"

# ── Email sending (Cloudflare Email Workers) ───────────────────────────────────
# Allows Workers/Functions to send outbound emails via Cloudflare.
# Requires Email Routing to be enabled for your zone in the Cloudflare dashboard.
# See: https://developers.cloudflare.com/email-routing/email-workers/send-email-workers/
#
# Remove the `destination_address` line if you want to send to arbitrary recipients
# (e.g. each registrant's own address).  When omitted, any To: address is allowed.

[[send_email]]
name = "SEB"

# ── Environment variables ──────────────────────────────────────────────────────
# Set the following as encrypted secrets in the Cloudflare Pages dashboard:
#   Settings → Environment variables → Production → Add variable
#
#   EXPORT_SECRET        – Long random string to protect the /api/export endpoint
#                          (e.g. output of: openssl rand -hex 32)
#
#   TURNSTILE_SECRET_KEY – Secret key from the Cloudflare Turnstile dashboard
#                          (Turnstile → <your widget> → Secret key)
#                          Also update index.html with the matching Turnstile site key.
#
#   FROM_EMAIL           – Verified sender address used in outgoing emails,
#                          e.g. "Fibra Óptica Torrent <noreply@fibra-torrent.es>"
#                          The domain must be configured in Cloudflare Email Routing.
#
#   SITE_URL             – Public URL of the site, e.g. https://fibra-torrent.es
#                          Used to build the unsubscribe link in confirmation emails.
#
# You may add a [vars] section for non-sensitive variables, e.g.:
# [vars]
# SITE_NAME = "Fibra Óptica Iniciativa"
